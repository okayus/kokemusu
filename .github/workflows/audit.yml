# Weekly audit of the deployed dependencies: an advisory published while no PR runs still
# surfaces within a week, and a failed scheduled run mails the workflow's owner (GitHub
# notifications). Deliberately not a PR check — a new advisory never turns an unrelated PR red.
# Same "stable shell" as ci.yml: the step calls the package.json script `audit:prod`.
name: Audit

on:
  schedule:
    - cron: "17 0 * * 1" # Mondays 00:17 UTC (09:17 JST)
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # no `version:` — it reads packageManager from package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Reads the lockfile only; no install needed.
      - name: pnpm audit --prod
        run: pnpm run audit:prod

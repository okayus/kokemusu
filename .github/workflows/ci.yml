# test/lint/typecheck only. Deploys are done by Workers Builds (Cloudflare side) =
# no Cloudflare secret exists in this repo's Actions (cloudflare-workers-builds-keyless-deploy).
# The main ruleset requires this workflow's job id `ci` as a status check — keep the name.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

# test/typecheck/build only. Deploys are done by Workers Builds (Cloudflare side) =
# no Cloudflare secret exists in this repo's Actions (cloudflare-workers-builds-keyless-deploy).
# The main ruleset requires this workflow's job id `ci` as a status check — keep the name.
# This yaml is a "stable shell": steps only call repo files (package.json `ci` script,
# .claude/hooks, .node-version), so what CI does can change from the sandbox without touching
# workflow yaml (the token has no `workflows` permission). Action @vN bumps come from Dependabot.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Status hub size check (docs/status.md ≤ 40 lines / 3 KB, fixed headings)
        run: bash .claude/hooks/check-status.sh docs/status.md
      - uses: pnpm/action-setup@v6 # no `version:` — it reads packageManager from package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, build, test
        run: pnpm run ci
